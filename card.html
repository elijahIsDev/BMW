<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="light-content" />
  <title>SoFi - Cards</title>
  <style>
    /* RESET & CORE STYLES */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: #F4F7F9;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }

    :root {
      --sofi-cyan: #00A9BE;
      --text-dark: #1E293B;
      --text-muted: #64748B;
      --border-gray: #EEF2F6;
    }

    /* DESKTOP APP FRAME CONTAINER */
    .app-container {
      width: 100%;
      max-width: 1200px;
      min-height: 100vh;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    /* TOP CYAN HEADER - DESKTOP FIRST */
    .sofi-top-banner {
      background-color: var(--sofi-cyan);
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      flex-shrink: 0;
    }

    .hamburger-icon {
      color: #FFFFFF;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .brand-center-logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-wordmark-top {
      font-size: 34px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -1.2px;
      line-height: 1;
    }

    /* DESKTOP SUB-HEADER ROW */
    .sub-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      background: #FFFFFF;
      border-bottom: 1px solid var(--border-gray);
    }

    .screen-title-center {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-dark);
    }

    .add-card-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #F1F5F9;
      color: #94A3B8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 22px;
      font-weight: 400;
    }

    /* MAIN CONTENT SCROLL AREA - DESKTOP GRID */
    .cards-content {
      flex: 1;
      padding: 32px;
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 40px;
      align-items: start;
    }

    .left-card-column {
      display: flex;
      flex-direction: column;
    }

    .right-settings-column {
      display: flex;
      flex-direction: column;
    }

    /* DEBIT CARD GRAPHIC */
    .debit-card-visual {
      width: 100%;
      height: 240px;
      background: linear-gradient(135deg, #00B2CB 0%, #008AA1 100%);
      border-radius: 18px;
      padding: 24px;
      position: relative;
      box-shadow: 0 8px 24px rgba(0, 169, 190, 0.25);
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      margin-bottom: 20px;
    }

    /* 4-CIRCLE PATTERN OVERLAY */
    .card-pattern-overlay {
      position: absolute;
      right: -10px;
      top: 10px;
      width: 180px;
      height: 180px;
      opacity: 0.15;
      pointer-events: none;
    }

    .card-top-row {
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 2;
    }

    .card-wordmark {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .card-middle-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 6px;
      z-index: 2;
    }

    /* EMV CHIP CONTAINER */
    .emv-chip-container {
      width: 50px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 4-LINE CONTACTLESS SYMBOL */
    .contactless-icon {
      transform: rotate(90deg);
      opacity: 0.95;
    }

    .card-bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 2;
    }

    .card-type-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      opacity: 0.85;
    }

    .visa-logo {
      font-size: 26px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -1px;
    }

    /* CARD TITLE & BALANCES */
    .card-info-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .card-title-text {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-dark);
    }

    .edit-pencil-icon {
      color: #94A3B8;
      cursor: pointer;
    }

    .card-balance-text {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-dark);
    }

    /* SETTINGS & CONTROLS */
    .settings-section-title {
      font-size: 16px;
      font-weight: 700;
      color: #94A3B8;
      margin-bottom: 16px;
    }

    .controls-list {
      display: flex;
      flex-direction: column;
    }

    .control-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0;
      border-bottom: 1px solid var(--border-gray);
    }

    .control-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .control-icon-box {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #F8FAFC;
      border: 1px solid var(--border-gray);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1E293B;
    }

    .control-label {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-dark);
    }

    .control-right {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .status-badge-text {
      font-size: 13px;
      font-weight: 800;
    }

    .status-badge-text.on {
      color: var(--sofi-cyan);
    }

    .status-badge-text.off {
      color: #64748B;
    }

    .dropdown-arrow {
      color: #1E293B;
    }

    /* ACCOUNT ACTIVITY */
    .activity-section-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 0;
      margin-top: 8px;
      cursor: pointer;
    }

    .activity-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-dark);
    }

    /* DESKTOP NAVIGATION SIDE / BOTTOM ADAPTATION */
    .bottom-nav-bar {
      height: 72px;
      background: #FFFFFF;
      border-top: 1px solid var(--border-gray);
      display: flex;
      justify-content: center;
      gap: 40px;
      align-items: center;
      z-index: 20;
    }

    .nav-tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #64748B;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      padding: 0 12px;
    }

    .nav-tab-item.active {
      color: var(--sofi-cyan);
    }

    /* MOBILE RESPONSIVE MEDIA QUERIES (< 768px) */
    @media (max-width: 767px) {
      body {
        background-color: #000;
      }

      .app-container {
        max-width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        box-shadow: none;
      }

      .sofi-top-banner {
        height: 56px;
        padding: 0 16px;
      }

      .brand-wordmark-top {
        font-size: 32px;
      }

      .sub-header-row {
        padding: 12px 20px;
        border-bottom: none;
      }

      .screen-title-center {
        font-size: 20px;
        margin-left: auto;
        margin-right: auto;
      }

      .add-card-btn {
        width: 32px;
        height: 32px;
        font-size: 20px;
      }

      /* SWITCH BACK TO SINGLE-COLUMN MOBILE LAYOUT */
      .cards-content {
        grid-template-columns: 1fr;
        gap: 0;
        padding: 10px 20px 90px 20px;
        overflow-y: auto;
      }

      .debit-card-visual {
        height: 200px;
        padding: 20px;
      }

      .card-wordmark {
        font-size: 26px;
      }

      .card-title-text {
        font-size: 16px;
      }

      .card-balance-text {
        font-size: 14px;
      }

      .settings-section-title {
        font-size: 15px;
      }

      .control-item-row {
        padding: 16px 0;
      }

      .control-icon-box {
        width: 36px;
        height: 36px;
      }

      .control-label {
        font-size: 15px;
      }

      .activity-section-row {
        padding: 20px 0;
      }

      .bottom-nav-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        justify-content: space-around;
        gap: 0;
      }

      .nav-tab-item {
        font-size: 11px;
        padding: 0;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- TOP CYAN HEADER WITHOUT RIGHT ICONS -->
    <div class="sofi-top-banner">
      <div class="hamburger-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </div>

      <div class="brand-center-logo">
        <span class="brand-wordmark-top">SoFi</span>
        <svg width="26" height="26" viewBox="0 0 96 96" fill="none">
          <circle cx="16" cy="16" r="16" fill="white"/>
          <circle cx="48" cy="16" r="16" fill="white"/>
          <circle cx="80" cy="16" r="13.5" stroke="white" stroke-width="5"/>
          <circle cx="16" cy="48" r="16" fill="white"/>
          <circle cx="48" cy="48" r="13.5" stroke="white" stroke-width="5"/>
          <circle cx="80" cy="48" r="16" fill="white"/>
          <circle cx="16" cy="80" r="13.5" stroke="white" stroke-width="5"/>
          <circle cx="48" cy="80" r="16" fill="white"/>
          <circle cx="80" cy="80" r="16" fill="white"/>
        </svg>
      </div>

      <div style="width: 24px;"></div> <!-- Spacer to perfectly center the logo brand mark -->
    </div>

    <!-- SUB-HEADER TITLE ROW -->
    <div class="sub-header-row">
      <div style="width: 32px;"></div>
      <div class="screen-title-center">Cards</div>
      <div class="add-card-btn">+</div>
    </div>

    <!-- MAIN SCROLL CONTENT (PC GRID / MOBILE SINGLE COLUMN) -->
    <main class="cards-content">

      <!-- LEFT COLUMN: DEBIT CARD GRAPHIC & BALANCES -->
      <div class="left-card-column">
        <div class="debit-card-visual">
          <svg class="card-pattern-overlay" viewBox="0 0 100 100">
            <circle cx="30" cy="30" r="18" fill="white"/>
            <circle cx="70" cy="30" r="18" fill="white"/>
            <circle cx="30" cy="70" r="18" fill="white"/>
            <circle cx="70" cy="70" r="18" fill="white"/>
          </svg>

          <div class="card-top-row">
            <span class="card-wordmark">SoFi</span>
            <svg width="18" height="18" viewBox="0 0 96 96" fill="none">
              <circle cx="16" cy="16" r="16" fill="white"/>
              <circle cx="48" cy="16" r="16" fill="white"/>
              <circle cx="80" cy="16" r="13.5" stroke="white" stroke-width="5"/>
              <circle cx="16" cy="48" r="16" fill="white"/>
              <circle cx="48" cy="48" r="13.5" stroke="white" stroke-width="5"/>
              <circle cx="80" cy="48" r="16" fill="white"/>
              <circle cx="16" cy="80" r="13.5" stroke="white" stroke-width="5"/>
              <circle cx="48" cy="80" r="16" fill="white"/>
              <circle cx="80" cy="80" r="16" fill="white"/>
            </svg>
          </div>

          <div class="card-middle-row">
            <div class="emv-chip-container">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 70" width="100%" height="100%">
                <defs>
                  <linearGradient id="emv-gold-base" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#E5C158"/>
                    <stop offset="25%" stop-color="#F2D77E"/>
                    <stop offset="50%" stop-color="#CBB04B"/>
                    <stop offset="75%" stop-color="#EED57B"/>
                    <stop offset="100%" stop-color="#B89733"/>
                  </linearGradient>
                  <linearGradient id="emv-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#FFF5C0" stop-opacity="0.6"/>
                    <stop offset="50%" stop-color="#D8B548" stop-opacity="0.2"/>
                    <stop offset="100%" stop-color="#91721F" stop-opacity="0.5"/>
                  </linearGradient>
                </defs>
                <rect x="2" y="2" width="96" height="66" rx="12" ry="12" fill="url(#emv-gold-base)" stroke="#8A6B1A" stroke-width="1.5"/>
                <rect x="2" y="2" width="96" height="66" rx="12" ry="12" fill="url(#emv-highlight)"/>
                <g stroke="#2C2108" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
                  <line x1="2" y1="25" x2="98" y2="25"/>
                  <line x1="2" y1="45" x2="98" y2="45"/>
                  <line x1="40" y1="25" x2="40" y2="45"/>
                  <line x1="60" y1="25" x2="60" y2="45"/>
                  <line x1="40" y1="25" x2="50" y2="14"/>
                  <line x1="60" y1="25" x2="50" y2="14"/>
                  <line x1="50" y1="14" x2="50" y2="2"/>
                  <line x1="40" y1="45" x2="50" y2="56"/>
                  <line x1="60" y1="45" x2="50" y2="56"/>
                  <line x1="50" y1="56" x2="50" y2="68"/>
                </g>
              </svg>
            </div>

            <svg class="contactless-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
              <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
              <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
              <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
          </div>

          <div class="card-bottom-row">
            <span class="card-type-label">DEBIT</span>
            <span class="visa-logo">VISA</span>
          </div>
        </div>

        <div class="card-info-header">
          <div class="card-title-row">
            <span class="card-title-text">SoFi Money® Debit Card</span>
            <svg class="edit-pencil-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
          </div>
          <div class="card-balance-text">
            Available: $3,230.00 &nbsp;&nbsp; Current: $3,230.00
          </div>
        </div>
      </div>

      <!-- RIGHT COLUMN: SETTINGS & CONTROLS -->
      <div class="right-settings-column">
        <div class="settings-section-title">Settings & Controls</div>

        <div class="controls-list">
          <div class="control-item-row">
            <div class="control-left">
              <div class="control-icon-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
              </div>
              <span class="control-label">Transaction Amount</span>
            </div>
            <div class="control-right">
              <span class="status-badge-text on">ON</span>
              <svg class="dropdown-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
          </div>

          <div class="control-item-row">
            <div class="control-left">
              <div class="control-icon-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 22V4a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v18"></path><path d="M13 10h4a2 2 0 0 1 2 2v10"></path><line x1="6" y1="12" x2="9" y2="12"></line></svg>
              </div>
              <span class="control-label">Gas Station</span>
            </div>
            <div class="control-right">
              <span class="status-badge-text off">OFF</span>
              <svg class="dropdown-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
          </div>

          <div class="control-item-row">
            <div class="control-left">
              <div class="control-icon-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"></polyline><polyline points="17 18 23 18 23 12"></polyline></svg>
              </div>
              <span class="control-label">Declined</span>
            </div>
            <div class="control-right">
              <span class="status-badge-text on">ON</span>
              <svg class="dropdown-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
          </div>

          <div class="control-item-row">
            <div class="control-left">
              <div class="control-icon-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
              </div>
              <span class="control-label">International</span>
            </div>
            <div class="control-right">
              <span class="status-badge-text off">OFF</span>
              <svg class="dropdown-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
          </div>

          <div class="control-item-row">
            <div class="control-left">
              <div class="control-icon-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>
              </div>
              <span class="control-label">Card Not Present</span>
            </div>
            <div class="control-right">
              <span class="status-badge-text off">OFF</span>
              <svg class="dropdown-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
          </div>
        </div>

        <div class="activity-section-row">
          <span class="activity-title">Account Activity</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </div>
      </div>

    </main>

    <!-- APP NAVIGATION BAR -->
    <nav class="bottom-nav-bar">
      <a href="Home.html" class="nav-tab-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        <span>Home</span>
      </a>

      <a href="Banking.html" class="nav-tab-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2"></circle></svg>
        <span>Banking</span>
      </a>

      <a href="card.html" class="nav-tab-item active">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
        <span>Credit Card</span>
      </a>

      <div class="nav-tab-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        <span>Invest</span>
      </div>

      <div class="nav-tab-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4l3 3"></path></svg>
        <span>Loans</span>
      </div>
    </nav>

  </div>

</body>
