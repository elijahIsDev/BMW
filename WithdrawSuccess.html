<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="light-content" />
  <title>SoFi - Withdrawal Successful</title>
  <style>
    /* RESET & CORE STYLES */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: #F8FAFC;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }

    :root {
      --sofi-cyan: #00A9BE;
      --text-dark: #0F172A;
      --text-muted: #64748B;
      --border-gray: #E2E8F0;
      --green-success: #16A34A;
      --green-bg-light: #F0FDF4;
    }

    /* APP CONTAINER (PC WIDESCREEN & MOBILE ADAPTIVE) */
    .app-container {
      width: 100%;
      max-width: 1200px;
      min-height: 100vh;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    }

    /* HEADER BAR */
    .screen-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: #FFFFFF;
      border-bottom: 1px solid #F1F5F9;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .close-nav-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0F172A;
      cursor: pointer;
      text-decoration: none;
    }

    .header-title-text {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-dark);
    }

    /* MAIN CONTENT */
    .success-content {
      flex: 1;
      padding: 40px 24px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* ANIMATED SUCCESS BADGE */
    .success-icon-badge {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--green-bg-light);
      color: var(--green-success);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 0 0 12px rgba(22, 163, 74, 0.08);
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popIn {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .success-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .success-subtitle {
      font-size: 15px;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 32px;
    }

    /* AMOUNT DISPLAY */
    .withdrawn-amount-hero {
      font-size: 40px;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -1px;
      margin-bottom: 32px;
    }

    /* RECEIPT DETAILS CARD */
    .receipt-details-card {
      width: 100%;
      background: #F8FAFC;
      border: 1px solid var(--border-gray);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 36px;
    }

    .receipt-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .receipt-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .receipt-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-dark);
    }

    .receipt-divider {
      height: 1px;
      background: var(--border-gray);
      width: 100%;
    }

    /* ACTION BUTTONS */
    .action-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-primary {
      width: 100%;
      height: 52px;
      background: var(--sofi-cyan);
      color: #FFFFFF;
      border: none;
      border-radius: 26px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-primary:active {
      opacity: 0.9;
      transform: scale(0.99);
    }

    .btn-secondary {
      width: 100%;
      height: 52px;
      background: transparent;
      color: var(--text-dark);
      border: 1.5px solid var(--border-gray);
      border-radius: 26px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .btn-secondary:active {
      background: #F1F5F9;
    }

    /* MOBILE RESPONSIVE MEDIA QUERIES (< 768px) */
    @media (max-width: 767px) {
      body { background-color: #FFFFFF; }
      .app-container { box-shadow: none; }
      .success-content { padding: 32px 20px; }
      .withdrawn-amount-hero { font-size: 34px; }
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- HEADER BAR -->
    <header class="screen-header">
      <div style="width: 36px;"></div>
      <span class="header-title-text">Confirmation</span>
      <a href="Banking.html" class="close-nav-btn" title="Close">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </a>
    </header>

    <!-- CONTENT -->
    <main class="success-content">

      <!-- SUCCESS ICON -->
      <div class="success-icon-badge">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>

      <h1 class="success-title">Withdrawal Initiated</h1>
      <p class="success-subtitle">Your funds are on the way to your account.</p>

      <!-- DYNAMIC AMOUNT DISPLAY -->
      <div class="withdrawn-amount-hero" id="displayAmount">$0.00</div>

      <!-- DETAILS CARD -->
      <div class="receipt-details-card">
        <div class="receipt-row">
          <span class="receipt-label">Payout Method</span>
          <span class="receipt-value" id="payoutMethodName">External Payout</span>
        </div>

        <div class="receipt-row">
          <span class="receipt-label">Recipient Account</span>
          <span class="receipt-value" id="payoutAccount">--</span>
        </div>

        <div class="receipt-divider"></div>

        <div class="receipt-row">
          <span class="receipt-label">Estimated Arrival</span>
          <span class="receipt-value" style="color: var(--green-success);">Instant (1-2 mins)</span>
        </div>

        <div class="receipt-row">
          <span class="receipt-label">Transfer Fee</span>
          <span class="receipt-value">$0.00</span>
        </div>

        <div class="receipt-divider"></div>

        <div class="receipt-row">
          <span class="receipt-label">Transaction ID</span>
          <span class="receipt-value" style="font-family: monospace; font-size: 13px; color: #64748B;">#SF-90482103</span>
        </div>
      </div>

      <!-- ACTIONS -->
      <div class="action-group">
        <a href="Banking.html" class="btn-primary">Back to Banking</a>
        <button class="btn-secondary" onclick="alert('Receipt downloaded')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Download Receipt
        </button>
      </div>

    </main>

  </div>

  <script>
    // Grab the actual method, amount, and account from URL parameters
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const method = urlParams.get('method');
      const amount = urlParams.get('amount');
      const account = urlParams.get('account');

      if (method) {
        document.getElementById('payoutMethodName').innerText = method;
      }

      if (amount) {
        const parsedAmt = parseFloat(amount);
        if (!isNaN(parsedAmt)) {
          document.getElementById('displayAmount').innerText = '$' + parsedAmt.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        } else {
          document.getElementById('displayAmount').innerText = '$' + amount;
        }
      }

      if (account) {
        document.getElementById('payoutAccount').innerText = account;
      }
    });
  </script>

</body>
</html>
